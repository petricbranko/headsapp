# Production: app + MongoDB + Caddy (automatic HTTPS). Configure via .env (see .env.example).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/headsapp
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal, web]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  mongo:
    image: mongo:8
    restart: unless-stopped
    # No published ports: only reachable from the app on the internal network.
    volumes: [mongo-data:/data/db]
    networks: [internal]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
    networks: [web]

networks:
  internal:
    internal: true
  web:

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
